[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelrack"
description = "The suite's only model client: a provider-neutral abstraction over local inference runtimes (Ollama first), with a deterministic FakeProvider."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dynamic = ["version"]
authors = [{ name = "Local AI Suite contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "baseaicore>=0.4,<0.5",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    # >=9.0.3 excludes PYSEC-2026-1845 (vulnerable /tmp/pytest-of-{user} handling,
    # affecting pytest through 9.0.2). Matches the pin BaseAiCore and SetSpec already moved to.
    "pytest>=9.0.3,<10",
    "pytest-cov>=5,<6",
    "pytest-randomly>=3,<4",
    "mypy>=1.11,<2",
    "ruff>=0.6,<1",
    "import-linter>=2.0,<3",
    "respx>=0.21,<1",
]

[project.urls]
Homepage = "https://github.com/JPKell/ModelRack"
Documentation = "https://github.com/JPKell/ModelRack/tree/main/docs"
Changelog = "https://github.com/JPKell/ModelRack/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/modelrack/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/modelrack"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# ruff formats Python code blocks inside markdown. `docs/` is a verbatim copy of the suite's
# master documents, shared byte-for-byte with the other nine repositories, so reformatting it
# here would desync it from its source and from every sibling copy. Excluded rather than
# reformatted; the documents are maintained where they originate.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "T20", "DTZ", "PTH", "D1", "BLE"]
ignore = ["D100", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D1"]
# T201: scripts/ holds standalone CLI tools (doc regeneration); reporting what they did on stdout
# is their entire user interface. The library itself still prints nothing (spec §17).
"scripts/**" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "-m 'not live and not performance'"
markers = [
    "live: requires a real provider/GPU, never in default CI",
    "performance: performance budget assertions, excluded by default",
    "contract: public API/schema conformance in both directions",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/modelrack"]
branch = true

[tool.coverage.report]
# Spec §18 and acceptance criterion 7 both say 95; the scaffold shipped 85.
fail_under = 95
show_missing = true
